# Installs the latest Android build from Expo on a test phone (an emulator) and prints why it closes, if it does.
# Runs when started from GitHub > Actions > "Phone app crash check", or on pushes to the claude/real-app-path-psq6kf branch.
name: Phone app crash check

on:
  workflow_dispatch:
  push:
    branches: [claude/real-app-path-psq6kf]
    paths: [.github/workflows/phone-app-crash-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Find the latest Android build
        working-directory: mobile
        run: |
          eas init --non-interactive --force
          eas build:list --platform android --status finished --limit 1 --json --non-interactive > builds.json
          URL=$(node -e 'const b=require("./builds.json")[0]; console.log(b.artifacts.buildUrl || b.artifacts.applicationArchiveUrl)')
          echo "APK: $URL"
          curl -sSL -o "$RUNNER_TEMP/app.apk" "$URL"
          ls -l "$RUNNER_TEMP/app.apk"
      - name: Let the emulator use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/app.apk"
            adb logcat -c
            adb shell monkey -p com.seshhon.app -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "===== still running? ====="
            adb shell pidof com.seshhon.app || echo "NOT RUNNING (it closed)"
            echo "===== crash report ====="
            adb logcat -d -b crash || true
            echo "===== app log ====="
            adb logcat -d | grep -E "AndroidRuntime|ReactNative|ReactNativeJS|Expo|FATAL|Exception|Error" | tail -150 || true
