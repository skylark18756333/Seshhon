# Builds an Android test APK on Expo, opens it on a test phone (an emulator), and fails if the app closes by itself.
# Runs when started from GitHub > Actions > "Phone app crash check", or on a pull request that changes the phone app.
# (A pull request's changes are compared with main, so merging main into a branch doesn't set it off.)
# If the Expo account has no free builds left this month, it says so and passes instead of failing.
name: Phone app crash check

on:
  workflow_dispatch:
  pull_request:
    paths: [mobile/**, '!mobile/store/**', '!mobile/**/*.md']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the APK on Expo
        id: build
        working-directory: mobile
        run: |
          npm ci
          npm run bundle-web
          eas init --non-interactive --force
          if ! eas build --platform android --profile preview --non-interactive --wait --json > builds.json 2> build-log.txt; then
            cat build-log.txt
            if grep -q "used its Android builds" build-log.txt builds.json; then
              echo "::warning::No free Expo Android builds left this month, so the crash check was skipped. They reset at the start of next month, or upgrade the Expo plan."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Show why Expo's build failed, since its build page needs an Expo login to read.
            ID=$(grep -o 'builds/[0-9a-f-]\{36\}' build-log.txt | head -1 | cut -d/ -f2)
            if [ -n "$ID" ]; then
              eas build:view "$ID" --json > failed.json || true
              node -e 'const b=require("./failed.json"); console.log("Expo says:", JSON.stringify(b.error || null)); for (const u of b.logFiles || []) console.log(u)' > failed-logs.txt || true
              cat failed-logs.txt
              grep '^https://' failed-logs.txt | while read -r u; do curl -sSL --compressed -D part.head -o part.log "$u"; grep -i '^content-' part.head || true; node -e '
                const z = require("zlib"), d = require("fs").readFileSync("part.log");
                const tries = [(x) => x, z.gunzipSync, z.brotliDecompressSync, z.inflateSync, z.inflateRawSync];
                for (const t of tries) { try { const s = t(d).toString("utf8"); if (!s.includes("\ufffd")) { console.log(s.split("\n").filter(Boolean).slice(-150).join("\n")); process.exit(0); } } catch (e) {} }
                console.log("Could not read the log. First bytes:", d.subarray(0, 16).toString("hex"));
              '; done || true
            fi
            exit 1
          fi
          cat build-log.txt
          URL=$(node -e 'const b=require("./builds.json")[0]; console.log(b.artifacts.buildUrl || b.artifacts.applicationArchiveUrl)')
          echo "Build page: https://expo.dev/accounts/skylark18756333s-team/projects/seshhon/builds/$(node -e 'console.log(require("./builds.json")[0].id)')"
          echo "APK: $URL"
          curl -sSL -o "$RUNNER_TEMP/app.apk" "$URL"
          ls -l "$RUNNER_TEMP/app.apk"
      - name: Let the emulator use hardware speed-up
        if: steps.build.outputs.skipped != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the app
        if: steps.build.outputs.skipped != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/app.apk"
            adb logcat -c
            adb shell monkey -p com.seshhon.app -c android.intent.category.LAUNCHER 1
            sleep 25
            # The emulator runner starts a new shell for every line, so no variables carry between lines.
            echo "===== still running? ====="
            adb shell pidof com.seshhon.app || echo "not running"
            echo "===== crash report ====="
            adb logcat -d -b crash || true
            adb exec-out screencap -p > "$RUNNER_TEMP/screen.png" || true
            echo "===== app log ====="
            adb logcat -d | grep -E "AndroidRuntime|ReactNativeJS|chromium" | tail -80 || true
            adb shell pidof com.seshhon.app || { echo "The app closed by itself."; exit 1; }
      - name: Keep the screenshot
        if: always() && steps.build.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshot
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: ignore
