<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seshhon">
<title>Seshhon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, scrolling content above a four-tab bar; the status colour is the only loud thing on screen. */
:root {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1F1D1A;
  --surface-2: #2A2723;
  --line: #3A362F;
  --fg: #F4F1EA;
  --muted: #ABA59B;
  --on: #3DDC84;
  --thinking: #F5C542;
  --off: #F0524B;
  --ink: #121110;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
#app { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; }
main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 20px; padding-inline: 20px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -1px; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.top { display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
.pill { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status-word { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -1.5px; }
.switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg { height: 52px; border-radius: 26px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.seg .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.seg[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--ink); }
.seg[aria-pressed="true"] .dot { background: var(--ink); }
.btn { min-height: 54px; padding: 0 20px; border-radius: 27px; border: 0; background: var(--c, var(--on)); color: var(--ink); font-weight: 700; font-size: 16px; width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.btn.small-btn { min-height: 44px; width: auto; padding: 0 18px; font-size: 14px; border-radius: 22px; white-space: nowrap; }
.btn:disabled { background: var(--surface-2); color: var(--muted); cursor: default; border: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.lead { border: 2px solid var(--on); }
.card.deal-active { border-color: var(--thinking); }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--c, var(--line)); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.avatar.dashed { border-style: dashed; }
.avatars { display: flex; flex-wrap: wrap; gap: 4px; }
.friend { display: flex; align-items: center; gap: 12px; min-height: 54px; }
.friend .state { font-size: 13px; font-weight: 700; color: var(--c); }
.deal-title { font-weight: 700; color: var(--thinking); overflow-wrap: anywhere; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); border-radius: 4px; }
.lead .bar i { background: var(--on); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--ink); font-weight: 700; }
.stars { display: flex; gap: 2px; }
.star { width: 48px; height: 48px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.star svg { fill: none; }
.star[aria-pressed="true"] { color: var(--thinking); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.back { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.code-box { background: var(--fg); color: var(--ink); border-radius: 20px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.code { font-family: var(--display); font-weight: 800; font-size: 38px; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
.code-box .note { color: #5C574F; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field input[type="text"] { height: 52px; width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--on); }
.linkbox { font-size: 14px; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
nav button { position: relative; background: none; border: 0; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 12px; }
nav button[aria-current="page"] { color: var(--fg); font-weight: 700; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--on); color: var(--ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(360px, calc(100% - 32px)); background: var(--fg); color: var(--ink); font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 24px; text-align: center; }
.error { color: var(--off); font-size: 14px; font-weight: 500; }
.banner { background: var(--surface-2); border: 1px solid var(--off); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
</style>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections" hidden></nav>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var CFG = window.SESHHON_CONFIG || window.SESSHON_CONFIG || {};
  var API_URL = String(CFG.url || '').replace(/\/+$/, '');
  var API_KEY = String(CFG.key || '');
  var POLL_MS = Number(CFG.pollMs) || 5000;
  var SESSION_KEY = 'seshhon-session-v1';
  var INVITE_KEY = 'seshhon-pending-invite';

  var COLORS = { on: 'var(--on)', thinking: 'var(--thinking)', off: 'var(--off)' };
  var LABELS = { on: 'On', thinking: 'Thinking', off: 'Off' };
  var TAGS = ['Good vibe', 'Good value', 'Fast service'];
  var DEAL_TYPES = ['All', 'Food', 'Drinks', 'Entry', 'Events'];

  /* ---------- small helpers ---------- */
  function store(key, value) {
    try {
      if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
    return null;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function initials(n) { var p = String(n || '?').trim().split(/\s+/); return esc(((p[0] || '?').charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase()); }
  function first(n) { return String(n || 'Someone').trim().split(/\s+/)[0]; }
  function fmtLeft(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    if (h > 0) return h + 'h ' + m + 'm';
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function fmtClock(hhmm) {
    var parts = String(hhmm).split(':'), h = Number(parts[0]), m = Number(parts[1]);
    if (h === 23 && m === 59) return 'midnight';
    var suffix = h >= 12 ? 'pm' : 'am', twelve = h % 12 || 12;
    return twelve + (m ? ':' + (m < 10 ? '0' : '') + m : '') + suffix;
  }

  /* ---------- talking to the database ---------- */
  var session = store(SESSION_KEY);
  var refreshing = null;

  function saveSession(body) {
    if (!body || !body.access_token) throw new Error('Sign-in did not work. Try again.');
    session = {
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: body.expires_at || Math.floor(Date.now() / 1000) + (body.expires_in || 3600)
    };
    store(SESSION_KEY, session);
  }
  function authCall(path, body) {
    return fetch(API_URL + '/auth/v1/' + path, {
      method: 'POST',
      headers: { apikey: API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (!res.ok) {
          var err = new Error((json && (json.msg || json.message || json.error_description)) || 'Sign-in did not work. Try again.');
          err.status = res.status;
          throw err;
        }
        return json;
      });
    });
  }
  function signInAnonymously() {
    return authCall('signup', { data: {}, gotrue_meta_security: {} }).then(saveSession);
  }
  function refreshSession() {
    if (!refreshing) {
      refreshing = authCall('token?grant_type=refresh_token', { refresh_token: session.refresh_token })
        .then(saveSession)
        .catch(function (e) {
          // A refresh token that is refused means this phone's sign-in is gone for good.
          if (e.status === 400 || e.status === 401 || e.status === 403) { session = null; store(SESSION_KEY, null); }
          throw e;
        })
        .then(function () { refreshing = null; }, function (e) { refreshing = null; throw e; });
    }
    return refreshing;
  }
  function rpc(fn, args, retried) {
    var ready = session && session.expires_at - Date.now() / 1000 < 60 ? refreshSession() : Promise.resolve();
    return ready.then(function () {
      if (!session) { var gone = new Error('You have been signed out.'); gone.signedOut = true; throw gone; }
      return fetch(API_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: { apikey: API_KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify(args || {})
      });
    }).then(function (res) {
      if (res.status === 401 && !retried) return refreshSession().then(function () { return rpc(fn, args, true); });
      return res.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (!res.ok) throw new Error((json && json.message) || 'Something went wrong. Try again.');
        return json;
      });
    });
  }

  /* ---------- state ---------- */
  var D = null;            // the latest answer from api_state()
  var lastKey = '';        // used to skip redraws when nothing changed
  var clockOffset = 0;     // server time minus this phone's time
  var ui = { tab: 'home', screen: null, filter: 'All', confirm: null, staffError: '', offline: false, booted: false, linkShown: false };
  var seen = null;         // friend id -> colour at the last look, for "just went on" notices
  var acting = false;

  var view = document.getElementById('view'), tabs = document.getElementById('tabs'), toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3600);
  }
  function now() { return Date.now() + clockOffset; }
  function perthHour() {
    try {
      var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Australia/Perth', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(now())).split(':');
      return (Number(parts[0]) % 24) + Number(parts[1]) / 60;
    } catch (e) { var d = new Date(now()); return d.getHours() + d.getMinutes() / 60; }
  }
  function venueById(id) { return (D.venues || []).filter(function (v) { return v.id === id; })[0]; }
  function dealById(id) { return (D.deals || []).filter(function (d) { return d.id === id; })[0]; }
  function mySesh() { return (D.seshes || []).filter(function (s) { return s.am_member; })[0] || null; }
  function inviteLink() { return location.origin + location.pathname + '?invite=' + D.me.invite_code; }

  function load(quiet) {
    return rpc('api_state').then(function (data) {
      ui.offline = false;
      clockOffset = new Date(data.now).getTime() - Date.now();
      noticeFriends(data);
      var key = JSON.stringify([data.me, data.friends, data.requests_in, data.requests_out, data.seshes, data.venues, data.deals, data.staff_venues]);
      D = data; ui.booted = true;
      if (!quiet || key !== lastKey) { lastKey = key; render(); }
    }).catch(function (e) {
      if (e.signedOut || !session) { D = null; ui.booted = true; render(); return; }
      ui.offline = true; ui.booted = true;
      if (!quiet) toast(e.message);
      render();
    });
  }
  function noticeFriends(data) {
    var next = {};
    (data.friends || []).forEach(function (f) { next[f.id] = f.colour; });
    if (seen && data.me && data.me.colour !== 'off') {
      (data.friends || []).forEach(function (f) {
        if (f.colour === 'on' && seen[f.id] && seen[f.id] !== 'on') toast(first(f.name) + ' just went on.');
      });
    }
    seen = next;
  }
  function act(fn, args, okMsg) {
    if (acting) return Promise.resolve(null);
    acting = true;
    return rpc(fn, args).then(function (result) {
      if (okMsg) toast(okMsg);
      return load().then(function () { return result; });
    }).catch(function (e) { toast(e.message); return null; })
      .then(function (result) { acting = false; return result; });
  }

  var ICON = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    sesh: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21c0-3-1-5-4-6"/>',
    deals: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
    you: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>'
  };
  function svg(name, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  function avatar(name, colour, dashed) {
    return '<div class="avatar' + (dashed ? ' dashed' : '') + '" style="--c:' + (colour || 'var(--line)') + '">' + initials(name) + '</div>';
  }

  /* ---------- screens ---------- */
  function notConnected() {
    return '<div class="stack" style="gap:20px;margin-block:auto"><div class="wordmark">seshhon</div><h1>Not connected yet</h1>' +
      '<p class="muted">This copy of Seshhon has not been pointed at its database. Add the project address and public key to config.js.</p></div>';
  }
  function starting() {
    return '<div class="stack" style="gap:20px;margin-block:auto"><div class="wordmark">seshhon</div><p class="muted">Loading…</p></div>';
  }
  function welcome() {
    var invited = store(INVITE_KEY);
    return '<div class="stack" style="gap:24px;margin-block:auto">' +
      '<div class="wordmark">seshhon</div>' +
      '<h1>Tell your friends you\'re up for a sesh.</h1>' +
      '<p class="muted">' + (invited ? 'A friend invited you. Sign up and they will get your friend request.' : 'Go On when you\'re keen, see which friends are too, and pick a place together.') + '</p>' +
      '<form id="join" class="stack" style="gap:16px" novalidate>' +
      '<div class="field"><label for="name">Your first name</label><input id="name" type="text" autocomplete="given-name" maxlength="24"></div>' +
      '<label class="check" for="adult"><input id="adult" type="checkbox"><span>I am 18 or over</span></label>' +
      '<p id="join-error" class="error" hidden></p>' +
      '<button class="btn" type="submit" id="join-btn">Get started</button>' +
      '<p class="muted small">Your account lives in this browser. Clearing your browsing data signs you out for good.</p>' +
      '</form></div>';
  }

  function home() {
    var me = D.me, s = me.colour;
    var copy = {
      on: ["You're on.", "Friends who are On or Thinking can see you're up for a sesh."],
      thinking: ['Thinking.', "You're browsing. Friends see you might be keen."],
      off: ["You're off.", "You're hidden, and you can't see who else is on until you switch back."]
    }[s];
    var h = '<div class="top"><div class="wordmark">seshhon</div>' + (ui.offline ? '<span class="pill" style="border-color:var(--off);color:var(--off)">Offline</span>' : '') + '</div>';
    h += '<section class="stack"><div class="eyebrow">Your status</div>' +
      '<div class="status-word" id="status-word" style="color:' + COLORS[s] + '">' + copy[0] + '</div>' +
      '<p class="muted">' + copy[1] + (s !== 'off' && me.expires_at ? ' Back to off in <span data-until="' + new Date(me.expires_at).getTime() + '" data-kind="status">' + fmtLeft(new Date(me.expires_at).getTime() - now()) + '</span>.' : '') + '</p>' +
      '<div class="switch" role="group" aria-label="Set your status">' +
      ['on', 'thinking', 'off'].map(function (k) {
        return '<button class="seg" style="--c:' + COLORS[k] + '" data-act="status" data-v="' + k + '" aria-pressed="' + (s === k) + '"><span class="dot"></span>' + LABELS[k] + '</button>';
      }).join('') + '</div></section>';

    if (D.requests_in.length) {
      h += '<section class="stack"><h2>Friend requests</h2>' + D.requests_in.map(function (r) {
        return '<div class="card"><div class="row">' + avatar(r.name) + '<div class="grow"><strong>' + esc(r.name) + '</strong> wants to add you</div></div>' +
          '<div class="row"><button class="btn small-btn" data-act="accept" data-v="' + esc(r.friendship) + '">Accept</button>' +
          '<button class="btn small-btn ghost" data-act="unfriend" data-v="' + esc(r.friendship) + '">Decline</button></div></div>';
      }).join('') + '</section>';
    }

    var friends = D.friends;
    if (!friends.length) {
      h += '<div class="card"><h2>Add your friends</h2><p class="muted small">Seshhon only works with friends on it. Send them your invite link, then accept their request when it arrives.</p>' +
        '<button class="btn" data-act="share">Send your invite link</button>' + linkBox() + '</div>';
    } else if (s === 'off') {
      h += '<div class="card"><h2>Friends are hidden while you\'re off</h2><p class="muted small">Switch to On or Thinking to see who\'s up for it tonight.</p></div>';
    } else {
      var on = friends.filter(function (f) { return f.colour === 'on'; }).length;
      var th = friends.filter(function (f) { return f.colour === 'thinking'; }).length;
      h += '<section class="stack" style="gap:4px"><div class="row between"><h2>Up for it now</h2><span class="muted small">' + on + ' on, ' + th + ' thinking</span></div>' +
        friends.map(function (f) {
          return '<div class="friend">' + avatar(f.name, f.colour === 'off' ? 'var(--line)' : COLORS[f.colour], f.colour === 'thinking') +
            '<div class="grow"><div style="font-weight:500' + (f.colour === 'off' ? ';color:var(--muted)' : '') + '">' + esc(f.name) + '</div></div>' +
            '<div class="state" style="--c:' + (f.colour === 'off' ? 'var(--muted)' : COLORS[f.colour]) + '">' + LABELS[f.colour] + '</div></div>';
        }).join('') + '</section>';
      var sesh = mySesh();
      if (s === 'on') h += '<button class="btn" data-act="go-sesh">' + (sesh ? 'Open tonight\'s sesh' : 'Start a sesh') + '</button>';
      else h += '<button class="btn" style="--c:var(--thinking)" data-act="tab" data-v="deals">See tonight\'s deals</button>';
    }
    return h;
  }

  function linkBox() {
    return ui.linkShown ? '<p class="muted small">Copy this link and send it to a friend:</p><div class="linkbox" id="invite-link">' + esc(inviteLink()) + '</div>' : '';
  }

  // Same rule as the database: most votes wins, and a tie goes to the venue that reached its votes first.
  function leaderOf(sesh) {
    var by = {};
    sesh.votes.forEach(function (v) {
      var t = new Date(v.voted_at).getTime();
      if (!by[v.venue_id]) by[v.venue_id] = { n: 0, firstAt: t };
      by[v.venue_id].n += 1;
      if (t < by[v.venue_id].firstAt) by[v.venue_id].firstAt = t;
    });
    var best = null;
    Object.keys(by).forEach(function (id) {
      if (!best || by[id].n > by[best].n || (by[id].n === by[best].n && by[id].firstAt < by[best].firstAt)) best = id;
    });
    return { best: best, by: by };
  }

  function sesh() {
    var me = D.me, mine = mySesh();
    var h = '<div class="stack" style="gap:6px"><div class="eyebrow" style="color:var(--on)">' + (mine ? 'Live now' : 'Tonight') + '</div><h1>Tonight\'s sesh</h1></div>';
    if (!mine) {
      var others = D.seshes.filter(function (s) { return !s.am_member; });
      if (others.length) {
        h += '<div class="stack">' + others.map(function (s) {
          return '<div class="card"><div class="row between"><div class="grow"><div style="font-weight:700;font-size:17px">' + esc(first(s.creator_name)) + '\'s sesh</div>' +
            '<div class="muted small">' + s.members.length + ' in' + (s.locked_venue && venueById(s.locked_venue) ? ', going to ' + esc(venueById(s.locked_venue).name) : ', still choosing where') + '</div></div>' +
            '<button class="btn small-btn" data-act="join" data-v="' + esc(s.id) + '">Join</button></div></div>';
        }).join('') + '</div>';
      }
      if (me.colour === 'on') {
        h += '<p class="muted">' + (others.length ? 'Or start your own.' : 'Nobody has started one yet. Start a sesh and your friends who are On or Thinking can join and vote on where to go.') + '</p>' +
          '<button class="btn' + (others.length ? ' ghost' : '') + '" data-act="start-sesh">Start a sesh</button>';
      } else if (me.colour === 'thinking') {
        h += '<p class="muted">' + (others.length ? 'Go On to start your own.' : 'No sesh yet. Go On to start one.') + '</p><button class="btn" data-act="status" data-v="on">Go on</button>';
      } else {
        h += '<p class="muted">You\'re off, so seshes are hidden. Go On to start one or see your friends\' plans.</p><button class="btn" data-act="status" data-v="on">Go on</button>';
      }
      return h;
    }

    h += '<div class="card"><div class="avatars">' + mine.members.map(function (m) { return avatar(m.name || '?', 'var(--on)'); }).join('') + '</div>' +
      '<div><div style="font-weight:700">' + mine.members.length + ' in</div><div class="muted small">' +
      esc(mine.members.map(function (m) { return m.id === me.id ? 'You' : first(m.name); }).join(', ')) + '</div></div></div>';

    if (mine.locked_venue) {
      var lv = venueById(mine.locked_venue);
      h += '<div class="card lead"><div class="eyebrow" style="color:var(--on)">Locked in</div><h2>' + esc(lv ? lv.name : 'A venue') + '</h2>' +
        (lv ? '<p class="muted small">' + esc([lv.kind, lv.closes].filter(Boolean).join(', ')) + '</p><button class="btn" data-act="venue" data-v="' + esc(lv.id) + '">See venue and deals</button>' : '') + '</div>';
    } else {
      var tallyInfo = leaderOf(mine), total = mine.votes.length;
      var myVote = (mine.votes.filter(function (v) { return v.user_id === me.id; })[0] || {}).venue_id;
      h += '<div class="row between"><h2>Where to?</h2><span class="muted small">' + total + ' vote' + (total === 1 ? '' : 's') + ' in</span></div><div class="stack">';
      D.venues.forEach(function (ven) {
        var n = tallyInfo.by[ven.id] ? tallyInfo.by[ven.id].n : 0, isMine = myVote === ven.id, isLead = tallyInfo.best === ven.id;
        var deal = D.deals.filter(function (d) { return d.venue_id === ven.id && d.running; })[0];
        h += '<div class="card' + (isLead ? ' lead' : '') + '"><div class="row between"><div class="grow"><div style="font-weight:700;font-size:17px">' + esc(ven.name) + '</div>' +
          '<div class="muted small">' + esc([ven.kind, ven.closes].filter(Boolean).join(', ')) + '</div></div>' +
          '<button class="btn small-btn' + (isMine ? '' : ' ghost') + '" data-act="vote" data-v="' + esc(ven.id) + '" aria-pressed="' + isMine + '">' + (isMine ? 'Your vote' : 'Vote') + '</button></div>' +
          (deal ? '<div class="deal-title small">' + esc(deal.title) + '</div>' : '') +
          '<div class="row"><div class="bar"><i style="width:' + (total ? Math.round(n / total * 100) : 0) + '%"></i></div><div class="small" style="font-weight:700">' + n + ' vote' + (n === 1 ? '' : 's') + '</div></div></div>';
      });
      h += '</div>';
      if (mine.mine) {
        h += tallyInfo.best && venueById(tallyInfo.best)
          ? '<button class="btn" data-act="lock" id="lock">Lock in ' + esc(venueById(tallyInfo.best).name) + '</button>'
          : '<button class="btn" disabled id="lock">Lock in once someone votes</button>';
      } else {
        h += '<p class="muted small">' + esc(first(mine.creator_name)) + ' started this sesh and locks in the venue.</p>';
      }
    }
    h += mine.mine
      ? '<button class="btn ghost" data-act="end-sesh">End the sesh</button>'
      : '<button class="btn ghost" data-act="leave-sesh">Leave the sesh</button>';
    return h;
  }

  function dealLabel(d) {
    if (d.running) return 'Until ' + fmtClock(d.end_time);
    var h = perthHour(), start = Number(d.start_time.split(':')[0]) + Number(d.start_time.split(':')[1]) / 60;
    return h < start ? 'Starts ' + fmtClock(d.start_time) : 'Ended ' + fmtClock(d.end_time);
  }
  function dealCard(d, showVenue) {
    var ven = venueById(d.venue_id);
    return '<div class="card' + (d.running ? ' deal-active' : '') + '">' +
      '<div class="row between"><span class="eyebrow">' + esc(d.type) + '</span><span class="small muted">' + dealLabel(d) + '</span></div>' +
      '<div class="deal-title" style="font-size:17px">' + esc(d.title) + '</div>' +
      (showVenue && ven ? '<div class="small muted">' + esc(ven.name) + (ven.is_example ? ' (example venue)' : '') + '</div>' : '') +
      '<div class="row">' +
      (showVenue && ven ? '<button class="btn small-btn ghost" data-act="venue" data-v="' + esc(ven.id) + '">Venue</button>' : '') +
      '<button class="btn small-btn" style="--c:var(--thinking)" data-act="redeem" data-v="' + esc(d.id) + '"' + (d.running && !d.used ? '' : ' disabled') + '>' + (d.used ? 'Used tonight' : d.running ? (d.code ? 'Show code' : 'Use deal') : 'Not on now') + '</button></div></div>';
  }
  function deals() {
    var list = D.deals.filter(function (d) { return ui.filter === 'All' || d.type === ui.filter; });
    return '<div class="stack" style="gap:6px"><h1>Deals near you</h1><p class="muted small">Deals only work during their hours. Each person can use a deal once per night.</p></div>' +
      '<div class="chips" role="group" aria-label="Filter deals">' + DEAL_TYPES.map(function (t) {
        return '<button class="chip" data-act="filter" data-v="' + t + '" aria-pressed="' + (ui.filter === t) + '">' + t + '</button>';
      }).join('') + '</div>' +
      '<div class="stack" style="gap:12px">' + (list.length ? list.map(function (d) { return dealCard(d, true); }).join('') : '<p class="muted">No deals of this type tonight.</p>') + '</div>';
  }

  function venue(id) {
    var ven = venueById(id);
    if (!ven) return backBtn() + '<p class="muted">That venue is no longer listed.</p>';
    var h = backBtn() +
      '<div class="stack" style="gap:6px">' + (ven.is_example ? '<div class="eyebrow">Example venue</div>' : '') + '<h1>' + esc(ven.name) + '</h1><p class="muted small">' +
      (ven.ratings ? '<strong style="color:var(--fg)">' + Number(ven.average).toFixed(1) + '</strong> from ' + ven.ratings + ' rating' + (ven.ratings === 1 ? '' : 's') + '. ' : 'No ratings yet. ') +
      esc([ven.kind, ven.closes].filter(Boolean).join(', ')) + '</p></div>';
    var here = D.deals.filter(function (d) { return d.venue_id === id; });
    h += '<div class="stack" style="gap:12px"><h2>Deals here</h2>' + (here.length ? here.map(function (d) { return dealCard(d, false); }).join('') : '<p class="muted small">No deals here right now.</p>') + '</div>' +
      '<div class="stack" style="gap:12px;padding-top:18px;border-top:1px solid var(--line)"><h2>Rate this venue</h2>' +
      '<div class="stars" role="group" aria-label="Star rating">' + [1, 2, 3, 4, 5].map(function (n) {
        return '<button class="star" data-act="star" data-v="' + n + '" aria-label="' + n + ' star' + (n > 1 ? 's' : '') + '" aria-pressed="' + (ven.my_stars >= n) + '"><svg width="30" height="30" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">' + ICON.star + '</svg></button>';
      }).join('') + '</div>' +
      '<div class="chips">' + TAGS.map(function (t) {
        return '<button class="chip" data-act="tag" data-v="' + t + '" aria-pressed="' + (ven.my_tags.indexOf(t) >= 0) + '">' + t + '</button>';
      }).join('') + '</div></div>';
    var mine = mySesh();
    if (mine && !mine.locked_venue) h += '<button class="btn" data-act="suggest" data-v="' + esc(id) + '">Vote for this in tonight\'s sesh</button>';
    return h;
  }
  function backBtn() { return '<button class="back" data-act="close" aria-label="Back">' + svg('back', 20) + '</button>'; }

  function redeem(id) {
    var d = dealById(id);
    if (!d) return backBtn() + '<p class="muted">That deal is no longer listed.</p>';
    var ven = venueById(d.venue_id) || { name: 'the venue', id: null };
    var h = '<div class="row">' + backBtn() + '<div style="font-weight:700">' + esc(ven.name) + '</div></div>';
    if (d.used) {
      return h + '<h1>Deal used</h1><p class="deal-title">' + esc(d.title) + '</p><p class="muted">Each person can use a deal once per night. It will be available again tomorrow.</p>' +
        (ven.id ? '<button class="btn" data-act="venue" data-v="' + esc(ven.id) + '">Rate ' + esc(ven.name) + '</button>' : '');
    }
    h += '<div class="stack" style="gap:8px"><h1>Show this to staff</h1><p class="deal-title">' + esc(d.title) + '</p></div>';
    if (d.code) {
      var until = new Date(d.code_expires_at).getTime();
      h += '<div class="code-box"><div class="code" id="code">' + esc(d.code) + '</div><div class="note">Staff enter this code on their phone to confirm it</div></div>' +
        '<div class="tiles"><div class="card" style="gap:2px"><div class="muted small">Code runs out in</div><div class="tile-num" data-until="' + until + '" data-kind="code">' + fmtLeft(until - now()) + '</div></div>' +
        '<div class="card" style="gap:2px"><div class="muted small">Limit</div><div class="tile-num">1 per night</div></div></div>' +
        '<p class="muted small">This screen changes by itself once staff confirm the code.</p>';
    } else if (d.running) {
      h += '<div class="card"><h2>This code ran out</h2><p class="muted small">Codes last 15 minutes so they can\'t be passed around.</p></div><button class="btn" style="--c:var(--thinking)" data-act="redeem" data-v="' + esc(id) + '">Get a new code</button>';
    } else {
      h += '<div class="card"><h2>This deal has finished for today</h2></div>';
    }
    return h;
  }

  function you() {
    var me = D.me;
    var h = '<div class="row">' + '<div class="avatar" style="width:56px;height:56px;font-size:18px;--c:' + COLORS[me.colour] + '">' + initials(me.name) + '</div><div class="grow"><h1 style="font-size:28px">' + esc(me.name) + '</h1><p class="muted small">Status: ' + LABELS[me.colour] + '</p></div></div>';

    h += '<div class="card"><h2>Invite a friend</h2><p class="muted small">Send this link. When they sign up you get a friend request to accept.</p>' +
      '<button class="btn" data-act="share">Send your invite link</button>' + linkBox() + '</div>';

    if (D.staff_venues.length) {
      h += '<div class="card" style="border-color:var(--thinking)"><h2>Staff: confirm a deal code</h2><p class="muted small">Type the code from the customer\'s phone. Each code works once.</p>' +
        '<form id="staff" class="stack" novalidate><div class="field"><label for="staff-code">Deal code</label><input id="staff-code" type="text" autocomplete="off" autocapitalize="characters" placeholder="SESH-0000" maxlength="12"></div>' +
        (ui.staffError ? '<p class="error" id="staff-error">' + esc(ui.staffError) + '</p>' : '') +
        '<button class="btn" style="--c:var(--thinking)" type="submit">Confirm code</button></form></div>';
    }

    if (D.friends.length || D.requests_out.length) {
      h += '<div class="card"><h2>Your friends</h2>' +
        D.friends.map(function (f) {
          var asking = ui.confirm === 'unfriend:' + f.friendship;
          return '<div class="row between"><div class="grow">' + esc(f.name) + '</div>' +
            (asking
              ? '<button class="btn small-btn" style="--c:var(--off)" data-act="unfriend" data-v="' + esc(f.friendship) + '">Remove</button><button class="btn small-btn ghost" data-act="cancel-confirm">Keep</button>'
              : '<button class="btn small-btn ghost" data-act="ask" data-v="unfriend:' + esc(f.friendship) + '">Remove</button>') + '</div>';
        }).join('') +
        D.requests_out.map(function (r) {
          return '<div class="row between"><div class="grow">' + esc(r.name) + '<div class="muted small">Waiting for them to accept</div></div>' +
            '<button class="btn small-btn ghost" data-act="unfriend" data-v="' + esc(r.friendship) + '">Cancel</button></div>';
        }).join('') + '</div>';
    }

    h += '<div class="card"><h2>Put Seshhon on your home screen</h2><p class="muted small">On iPhone, tap the Share button in Safari, then Add to Home Screen. On Android, open the browser menu and tap Add to Home screen.</p></div>';

    h += '<div class="card"><h2>Your account</h2><p class="muted small">Your account lives in this browser on this phone. If you work at a venue, give the organiser this ID so they can set you up as staff:</p>' +
      '<div class="linkbox" id="my-id">' + esc(me.id) + '</div>' +
      (ui.confirm === 'delete'
        ? '<p class="error">This removes your name, friends, votes and ratings for good.</p><div class="row"><button class="btn small-btn" style="--c:var(--off)" data-act="delete-account">Delete for good</button><button class="btn small-btn ghost" data-act="cancel-confirm">Keep my account</button></div>'
        : '<button class="btn ghost" data-act="ask" data-v="delete">Delete my account</button>') + '</div>';
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var keep = document.getElementById('staff-code'), keepValue = keep ? keep.value : null, keepFocus = keep && document.activeElement === keep;
    var typing = document.activeElement && document.activeElement.id === 'name';
    if (typing && !D) return; // do not wipe the sign-up form while someone is typing in it

    if (!API_URL || !API_KEY) { tabs.hidden = true; view.innerHTML = notConnected(); return; }
    if (!ui.booted) { tabs.hidden = true; view.innerHTML = starting(); return; }
    if (!session || !D || !D.me) {
      tabs.hidden = true;
      if (!document.getElementById('join')) view.innerHTML = welcome();
      return;
    }
    var html;
    if (ui.screen && ui.screen.type === 'venue') html = venue(ui.screen.id);
    else if (ui.screen && ui.screen.type === 'redeem') html = redeem(ui.screen.id);
    else html = { home: home, sesh: sesh, deals: deals, you: you }[ui.tab]();
    view.innerHTML = html;
    tabs.hidden = false;
    var requests = D.requests_in.length;
    tabs.innerHTML = [['home', 'Home'], ['sesh', 'Sesh'], ['deals', 'Deals'], ['you', 'You']].map(function (t) {
      return '<button data-act="tab" data-v="' + t[0] + '"' + (ui.tab === t[0] && !ui.screen ? ' aria-current="page"' : '') + '>' + svg(t[0], 22) + '<span>' + t[1] + '</span>' +
        (t[0] === 'home' && requests ? '<span class="badge" aria-label="' + requests + ' friend requests">' + requests + '</span>' : '') + '</button>';
    }).join('');

    var again = document.getElementById('staff-code');
    if (again && keepValue !== null) { again.value = keepValue; if (keepFocus) again.focus(); }
  }
  function go(top) { render(); if (top) view.scrollTop = 0; }

  function shareInvite() {
    var link = inviteLink();
    ui.linkShown = true;
    if (navigator.share) {
      navigator.share({ title: 'Seshhon', text: 'Add me on Seshhon so we can see when we\'re both up for a sesh.', url: link }).catch(function () {});
      render();
      return;
    }
    var done = function () { toast('Invite link copied.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { toast('Copy the link shown below.'); });
    else toast('Copy the link shown below.');
    render();
  }

  var ACT = {
    tab: function (v) { ui.tab = v; ui.screen = null; ui.confirm = null; ui.staffError = ''; go(true); },
    status: function (v) {
      act('set_status', { new_colour: v }, v === 'on' ? 'You are on. Friends who are around can see it.' : null).then(function () {
        ui.tab = 'home'; ui.screen = null; go(false);
      });
    },
    'go-sesh': function () {
      if (mySesh()) { ui.tab = 'sesh'; go(true); return; }
      ACT['start-sesh']();
    },
    'start-sesh': function () { act('start_sesh', {}, 'Sesh started. Friends who are around can join.').then(function () { ui.tab = 'sesh'; go(true); }); },
    join: function (v) { act('join_sesh', { p_sesh: v }, 'You\'re in.'); },
    'leave-sesh': function () { var s = mySesh(); if (s) act('leave_sesh', { p_sesh: s.id }); },
    'end-sesh': function () { var s = mySesh(); if (s) act('end_sesh', { p_sesh: s.id }, 'Sesh ended.'); },
    vote: function (v) {
      var s = mySesh(); if (!s) return;
      var mine = (s.votes.filter(function (x) { return x.user_id === D.me.id; })[0] || {}).venue_id;
      act('cast_vote', { p_sesh: s.id, p_venue: mine === v ? null : v });
    },
    lock: function () { var s = mySesh(); if (s) act('lock_sesh', { p_sesh: s.id }, 'Locked in.').then(function () { view.scrollTop = 0; }); },
    suggest: function (v) {
      var s = mySesh(); if (!s) return;
      act('cast_vote', { p_sesh: s.id, p_venue: v }).then(function () { ui.screen = null; ui.tab = 'sesh'; go(true); });
    },
    filter: function (v) { ui.filter = v; go(false); },
    venue: function (v) { ui.screen = { type: 'venue', id: v }; go(true); },
    close: function () {
      if (ui.screen && ui.screen.type === 'redeem') { var d = dealById(ui.screen.id); ui.screen = d ? { type: 'venue', id: d.venue_id } : null; }
      else ui.screen = null;
      go(true);
    },
    redeem: function (v) {
      var d = dealById(v);
      if (d && d.code) { ui.screen = { type: 'redeem', id: v }; go(true); return; }
      act('request_deal_code', { p_deal: v }).then(function (r) { if (r) { ui.screen = { type: 'redeem', id: v }; go(true); } });
    },
    star: function (v) {
      var ven = venueById(ui.screen.id);
      act('rate_venue', { p_venue: ven.id, p_stars: Number(v), p_tags: ven.my_tags }, 'Rating saved.');
    },
    tag: function (v) {
      var ven = venueById(ui.screen.id);
      if (!ven.my_stars) { toast('Pick your stars first.'); return; }
      var tags = ven.my_tags.indexOf(v) >= 0 ? ven.my_tags.filter(function (t) { return t !== v; }) : ven.my_tags.concat(v);
      act('rate_venue', { p_venue: ven.id, p_stars: ven.my_stars, p_tags: tags });
    },
    share: shareInvite,
    accept: function (v) { act('answer_friend', { p_friendship: v, p_accept: true }, 'You\'re now friends.'); },
    unfriend: function (v) { ui.confirm = null; act('answer_friend', { p_friendship: v, p_accept: false }); },
    ask: function (v) { ui.confirm = v; go(false); },
    'cancel-confirm': function () { ui.confirm = null; go(false); },
    'delete-account': function () {
      act('delete_account', {}).then(function () {
        session = null; store(SESSION_KEY, null); D = null; seen = null; ui.confirm = null; ui.tab = 'home'; ui.screen = null;
        view.innerHTML = ''; render(); toast('Your account has been deleted.');
      });
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var fn = ACT[b.getAttribute('data-act')];
    if (fn) fn(b.getAttribute('data-v'));
  });

  function sendPendingInvite() {
    var code = store(INVITE_KEY);
    if (!code) return Promise.resolve();
    store(INVITE_KEY, null);
    return rpc('request_friend', { p_code: code }).then(function (r) {
      if (r && r.state === 'accepted') toast('You and ' + first(r.name) + ' are now friends.');
      else if (r) toast('Friend request sent to ' + first(r.name) + '.');
    }).catch(function (e) { toast(e.message); });
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'join') {
      var name = document.getElementById('name').value.trim(), adult = document.getElementById('adult').checked;
      var err = document.getElementById('join-error'), btn = document.getElementById('join-btn');
      var fail = function (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; };
      if (!name) return fail('Enter your first name to continue.');
      if (!adult) return fail('Seshhon is for people aged 18 and over. Tick the box to confirm.');
      btn.disabled = true; err.hidden = true;
      (session ? Promise.resolve() : signInAnonymously())
        .then(function () { return rpc('api_sign_up', { p_name: name, p_adult: true }); })
        .then(sendPendingInvite)
        .then(function () { document.activeElement && document.activeElement.blur(); view.innerHTML = ''; return load(); })
        .catch(function (x) { fail(x.message); });
    }
    if (e.target.id === 'staff') {
      var input = document.getElementById('staff-code'), code = input.value.trim().toUpperCase();
      if (!code) { ui.staffError = 'Type the code from the customer\'s phone.'; render(); return; }
      rpc('confirm_deal_code', { p_code: code }).then(function () {
        ui.staffError = ''; input.value = ''; toast('Code confirmed. Give them the deal.'); render();
        var fresh = document.getElementById('staff-code'); if (fresh) fresh.value = '';
      }).catch(function (x) { ui.staffError = x.message; render(); });
    }
  });

  /* ---------- clocks ---------- */
  setInterval(function () {
    if (!D || !D.me) return;
    var t = now(), els = view.querySelectorAll('[data-until]');
    for (var i = 0; i < els.length; i++) {
      var until = Number(els[i].getAttribute('data-until'));
      if (t >= until) { load(); return; }
      els[i].textContent = fmtLeft(until - t);
    }
  }, 1000);
  setInterval(function () {
    if (document.hidden || !session || !D || !D.me || acting) return;
    load(true);
  }, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && session && D && D.me) load(true);
  });

  /* ---------- start ---------- */
  try {
    var params = new URLSearchParams(location.search), invite = params.get('invite');
    if (invite) {
      store(INVITE_KEY, invite.slice(0, 16));
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) {}

  render();
  if (API_URL && API_KEY) {
    if (session) load().then(function () { if (D && D.me) return sendPendingInvite().then(function () { return load(true); }); });
    else { ui.booted = true; render(); }
  }
})();
</script>
</body>
</html>
