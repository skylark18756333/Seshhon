<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security policy: scripts only from this site (and the Cloudflare Turnstile sign-up check), and the app can only talk to
     the SeshOn Supabase project. If the Supabase project ever changes, change connect-src here as well as config.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://xfwrhetohauzhqqhkibm.supabase.co; frame-src https://challenges.cloudflare.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SeshOn">
<title>SeshOn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, scrolling content above a four-tab bar; the status colour is the only loud thing on screen. */
:root {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1F1D1A;
  --surface-2: #2A2723;
  --line: #3A362F;
  --fg: #F4F1EA;
  --muted: #ABA59B;
  --on: #3DDC84;
  --thinking: #F5C542;
  --off: #F0524B;
  --ink: #121110;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
#app { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; }
main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 20px; padding-inline: 20px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -1px; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.top { display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
.pill { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status-word { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -1.5px; }
/* Status switch: one track, a coloured knob you drag or flick across G, A, R; tapping a letter also works. */
.slide { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 68px; padding: 5px; border-radius: 34px; background: var(--surface); border: 1px solid var(--line); touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.slide .knob { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 29px; background: var(--c); box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.25s cubic-bezier(0.3, 1.35, 0.5, 1), background-color 0.2s; pointer-events: none; }
.slide.dragging .knob { transition: background-color 0.2s; }
.slide .stop { position: relative; z-index: 1; border: 0; background: none; border-radius: 29px; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: 1px; color: var(--muted); transition: color 0.2s; }
.slide .stop[aria-pressed="true"] { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .slide .knob { transition: none; } }
.btn { min-height: 54px; padding: 0 20px; border-radius: 27px; border: 0; background: var(--c, var(--on)); color: var(--ink); font-weight: 700; font-size: 16px; width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.btn.small-btn { min-height: 44px; width: auto; padding: 0 18px; font-size: 14px; border-radius: 22px; white-space: nowrap; }
.btn:disabled { background: var(--surface-2); color: var(--muted); cursor: default; border: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.lead { border: 2px solid var(--on); }
.card.deal-active { border-color: var(--thinking); }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--c, var(--line)); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.avatar.dashed { border-style: dashed; }
.avatars { display: flex; flex-wrap: wrap; gap: 4px; }
.friend { display: flex; align-items: center; gap: 12px; min-height: 54px; }
.friend .state { font-size: 13px; font-weight: 700; color: var(--c); }
.deal-title { font-weight: 700; color: var(--thinking); overflow-wrap: anywhere; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); border-radius: 4px; }
.lead .bar i { background: var(--on); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--ink); font-weight: 700; }
.stars { display: flex; gap: 2px; }
.star { width: 48px; height: 48px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.star svg { fill: none; }
.star[aria-pressed="true"] { color: var(--thinking); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.back { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.code-box { background: var(--fg); color: var(--ink); border-radius: 20px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.code { font-family: var(--display); font-weight: 800; font-size: 38px; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
.code-box .note { color: #5C574F; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field input[type="text"] { height: 52px; width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--on); }
.linkbox { font-size: 14px; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
nav button { position: relative; background: none; border: 0; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 12px; }
nav button[aria-current="page"] { color: var(--fg); font-weight: 700; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--on); color: var(--ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(360px, calc(100% - 32px)); background: var(--fg); color: var(--ink); font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 24px; text-align: center; }
a { color: var(--fg); }
.chat { max-height: 300px; min-height: 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
.msg { align-self: flex-start; max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--surface-2); }
.msg .who { font-size: 12px; color: var(--muted); }
.msg .acts { display: flex; align-items: center; gap: 14px; }
.linkbtn { background: none; border: 0; padding: 6px 0; min-height: 36px; font-size: 12px; color: var(--muted); text-decoration: underline; }
.chat-form { display: flex; gap: 8px; }
.chat-form input { flex: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; }
.error { color: var(--off); font-size: 14px; font-weight: 500; }
.banner { background: var(--surface-2); border: 1px solid var(--off); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
</style>
<script src="load-config.js"></script>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections" hidden></nav>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
